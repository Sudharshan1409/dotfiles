# #######################################################################################
# #  WINDOW RULES                                                                       #
# #######################################################################################
# See https://wiki.hyprland.org/Configuring/Window-Rules/

# Suppress maximization events to keep windows tiled
windowrulev2 = suppressevent maximize, class:.*

# --- Fix for Borders on Pop-ups and Menus ---

# Rule for "Save As..." / "Open File..." dialogs (KEEP THIS)
windowrulev2 = noborder, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noblur, class:^(Xdg-desktop-portal-gtk)$

# NEW BEHAVIOR-BASED RULE for Brave Menus and Pop-ups
windowrulev2 = noborder, class:^(Brave-browser)$,floating:1,xwayland:1
windowrulev2 = noshadow, class:^(Brave-browser)$,floating:1,xwayland:1
windowrulev2 = noblur, class:^(Brave-browser)$,floating:1,xwayland:1

# FIX: Remove borders from dialogs, pop-ups, and context menus
windowrulev2 = noborder, class:.*, xdg-foreign-toplevel:1
windowrulev2 = noshadow, class:.*, xdg-foreign-toplevel:1

# --- Floating Windows ---
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(blueberry.py)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$

# --- Size & Position for Floating Windows ---
windowrulev2 = size 60% 60%, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = size 60% 60%, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# --- Animation for Rofi ---
windowrulev2 = animation slide-down, class:^Rofi$

# --- Assign Apps to Specific Workspaces ---
windowrulev2 = workspace 3, class:^(Brave-browser)$
windowrulev2 = workspace 2, class:^(org.wezfurlong.wezterm)$
windowrulev2 = workspace 1, class:^(Spotify)$

windowrulev2=noblur,class:^()$,title:^()$