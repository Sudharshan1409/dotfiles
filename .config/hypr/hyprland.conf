###########################################################################################
#  SOURCE OTHER CONFIG FILES                                                              #
###########################################################################################

source=~/.config/hypr/mocha.conf
source=~/.config/hypr/autostart.conf
source=~/.config/hypr/bindings.conf
source=~/.config/hypr/windows.conf
source=~/.config/hypr/envs.conf
source=~/.config/hypr/input.conf
source=~/.config/hypr/looknfeel.conf

# Monitor configuration is now handled by kanshi (see ~/.config/kanshi/config)
# kanshi auto-detects monitors and applies profiles, then runs assign_workspaces.sh

exec-once = ~/.config/hypr/scripts/cache_lockscreen_info.sh

# Fallback for any unrecognized monitors
monitor = , preferred, auto, 1

exec-once = hyprctl dispatch workspace 2
