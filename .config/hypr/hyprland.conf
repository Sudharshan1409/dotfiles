# #######################################################################################
# #  STARTUP & ENVIRONMENT                                                              #
# #######################################################################################

# --- Source Catppuccin Mocha Theme ---
source=~/.config/hypr/mocha.conf

# --- Programs and Services to Execute at Launch ---
exec-once = waybar & swaync & hyprpaper & hypridle
exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 28
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator
exec-once = elephant & walker --gapplication-service

exec-once = ~/.config/hypr/scripts/set_wallpaper.sh --init



# --- Environment Variables ---
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct


# #######################################################################################
# #  MONITORS & WORKSPACES                                                              #
# #######################################################################################

# --- Monitor Configuration ---
# See https://wiki.hyprland.org/Configuring/Monitors/
# Positions monitors left-to-right: Laptop -> Main -> Secondary
monitor = eDP-1, 1920x1080@120, 0x0, 1
monitor = HDMI-A-1, 2560x1440@165, 1920x0, 1
monitor = DVI-I-1, 1920x1080@120, 4480x0, 1

# --- Assign Default Workspaces to Monitors ---
workspace = 1, monitor:eDP-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:DVI-I-1


# #######################################################################################
# #  INPUT & DEVICES                                                                    #
# #######################################################################################

# --- Keyboard and Mouse Input ---
# See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = yes

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification
}

# --- Per-Device Configuration ---
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# #######################################################################################
# #  LAYOUT & GAPS                                                                      #
# #######################################################################################

# --- General Layout Properties ---
# See https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 3
    resize_on_border = true

    # Gradient border colors
    col.active_border = $mauve $flamingo 90deg
    col.inactive_border = $subtext0

    layout = dwindle
    allow_tearing = false
}

# --- Dwindle Layout Specifics ---
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
    # precise_mouse_move = true
}


# #######################################################################################
# #  AESTHETICS & VISUALS                                                               #
# #######################################################################################

# --- Decorations (Rounding, Blur, Shadow) ---
# See https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# --- Animations ---
# See https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = true
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    # Configs
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}


# #######################################################################################
# #  WINDOW RULES                                                                       #
# #######################################################################################
# See https://wiki.hyprland.org/Configuring/Window-Rules/

# Suppress maximization events to keep windows tiled
windowrulev2 = suppressevent maximize, class:.*

# --- Fix for Borders on Pop-ups and Menus ---

# Rule for "Save As..." / "Open File..." dialogs (KEEP THIS)
windowrulev2 = noborder, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noblur, class:^(Xdg-desktop-portal-gtk)$

# NEW BEHAVIOR-BASED RULE for Brave Menus and Pop-ups
windowrulev2 = noborder, class:^(Brave-browser)$,floating:1,xwayland:1
windowrulev2 = noshadow, class:^(Brave-browser)$,floating:1,xwayland:1
windowrulev2 = noblur, class:^(Brave-browser)$,floating:1,xwayland:1

# FIX: Remove borders from dialogs, pop-ups, and context menus
windowrulev2 = noborder, class:.*, xdg-foreign-toplevel:1
windowrulev2 = noshadow, class:.*, xdg-foreign-toplevel:1

# --- Floating Windows ---
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(blueberry.py)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$

# --- Size & Position for Floating Windows ---
windowrulev2 = size 60% 60%, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = size 60% 60%, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# --- Animation for Rofi ---
windowrulev2 = animation slide-down, class:^Rofi$

# --- Assign Apps to Specific Workspaces ---
windowrulev2 = workspace 3, class:^(Brave-browser)$
windowrulev2 = workspace 2, class:^(org.wezfurlong.wezterm)$
windowrulev2 = workspace 1, class:^(Spotify)$

windowrulev2=noblur,class:^()$,title:^()$


# #######################################################################################
# #  KEYBINDINGS                                                                        #
# #######################################################################################

# --- Main Modifier Key ---
$mainMod = SUPER

# --- Application Shortcuts ---
$terminal = wezterm
$downloads = nautilus ~/Downloads
$weztermWallpapers = nautilus ~/wezterm-wallpapers
$backgrounds = nautilus ~/.config/backgrounds
$home = nautilus ~
$config = nautilus ~/.config
$menu = walker --height 800 --width 1200 --placeholder "Search for applications"

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = SUPER_SHIFT, C, exec, $config
# bind = SUPER_SHIFT, W, exec, $weztermWallpapers
bind = $mainMod SHIFT, B, exec, $backgrounds
bind = $mainMod SHIFT, D, exec, $downloads
bind = $mainMod SHIFT, HOME, exec, $home
bind = $mainMod, B, exec, brave --enable-features=UseOzonePlatform --ozone-platform=x11
bind = $mainMod, S, exec, spotify

# --- Hyprland System Controls ---
bind = $mainMod CTRL, M, exit,          # Exit Hyprland session
bind = $SUPER_SHIFT, R, exec, hyprctl reload # Reload Hyprland config
bind = $mainMod CTRL, L, exec, hyprlock      # Lock the screen

bind = $mainMod, X, exec, ~/.config/waybar/scripts/power-menu.sh

bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/set_wallpaper.sh

# --- Window Management ---
bind = $mainMod, C, killactive,          # Close active window
bind = $mainMod, V, togglefloating,      # Toggle floating mode for a window
bind = $mainMod, F, fullscreen,          # Toggle fullscreen
bind = $mainMod, W, togglegroup,         # Group windows
bind = $mainMod, T, togglesplit,         # THIS IS THE CORRECTED LINE: Toggle split direction (vertical/horizontal)
bind = $mainMod, P, pseudo,              # Toggle pseudotiling

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# --- Move Focus ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Resize Tiled Windows ---
# Hold Super + Alt and press H, J, K, or L to resize
binde = $mainMod ALT, H, resizeactive, -20 0
binde = $mainMod ALT, L, resizeactive, 20 0
binde = $mainMod ALT, K, resizeactive, 0 -20
binde = $mainMod ALT, J, resizeactive, 0 20

# --- Workspace Navigation ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move Windows to Workspaces ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

workspace=1,monitor:eDP-1
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:HDMI-A-1
workspace=5,monitor:HDMI-A-1
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:DVI-I-1
workspace=9,monitor:DVI-I-1
workspace=10,monitor:DVI-I-1

# --- Scroll Through Workspaces ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Special Workspace (Scratchpad) ---
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# --- Hardware Keys & System Utilities ---
binde = , XF86AudioRaiseVolume, exec, ~/.config/waybar/scripts/volume-control.sh up
binde = , XF86AudioLowerVolume, exec, ~/.config/waybar/scripts/volume-control.sh down
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = , Print, exec, hyprshot -m window
bind = SHIFT, Print, exec, hyprshot -m region

# --- Mouse Bindings ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# In the "KEYBINDINGS" section, under "Window Management" is a good spot


# #######################################################################################
# #  MISCELLANEOUS SETTINGS                                                             #
# #######################################################################################

xwayland {
    force_zero_scaling = true
}

misc {
    # Disable the default anime wallpaper
    force_default_wallpaper = 0
}

