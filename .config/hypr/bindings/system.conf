# --- Hyprland System Controls ---
bind = $mainMod CTRL, M, exit,          # Exit Hyprland session
bind = $mainMod CTRL, R, exec, hyprctl reload && notify-send -i "dialog-information" -a "Hyprland" "Hyprland" "Config reloaded successfully!" # Reload Hyprland config
bind = $mainMod CTRL, L, exec, hyprlock      # Lock the screen
bind = $mainMod CTRL, S, exec, systemctl suspend # Suspend the system
bind = $mainMod CTRL, H, exec, ~/.config/hypr/scripts/toggle_hypridle.sh # Toggle hypridle

bind = $mainMod CTRL, X, exec, ~/.config/waybar/scripts/power-menu.sh

bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/set_wallpaper.sh

# Monitor Profile Manager (Ctrl+Super+D)
bind = $mainMod CTRL, D, exec, ~/.config/hypr/scripts/monitor_profile_manager.sh menu
bind = $mainMod CTRL SHIFT, D, exec, ~/.config/hypr/scripts/monitor_profile_manager.sh auto

# OCR (Text from Screen)
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/ocr.sh

# Keybinding Help Menu (Super + /)
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/keybinding_menu.sh

# App-Specific Help (Super + Shift + ?)
bind = $mainMod SHIFT, slash, exec, ~/.config/hypr/scripts/app_help.sh

# Quick Calculator (Super + Alt + C)
bind = $mainMod ALT, C, exec, ~/.config/hypr/scripts/calculator.sh

# Process Killer (Super + Alt + P)
bind = $mainMod ALT, P, exec, ~/.config/hypr/scripts/process_killer.sh

# Audio Device Switcher (Super + Alt + A)
bind = $mainMod ALT, A, exec, ~/.config/hypr/scripts/audio_switcher.sh
