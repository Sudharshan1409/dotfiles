# --- Application Shortcuts ---
$downloads = nautilus ~/Downloads
$weztermWallpapers = nautilus ~/wezterm-wallpapers
$backgrounds = nautilus ~/.config/backgrounds
$home = nautilus ~
$menu = rofi -show drun -show-icons -display-drune "Apps" -theme ~/.config/rofi/launcher-elegant.rasi

# --- Application Shortcuts ($mainMod + ALT) ---
bind = $mainMod ALT, S, exec, spotify
bind = $mainMod ALT, D, exec, $downloads
bind = $mainMod ALT, B, exec, $backgrounds
bind = $mainMod ALT, W, exec, $weztermWallpapers
bind = $mainMod ALT, H, exec, $home


# --- Other App-related Shortcuts ---
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod CTRL, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod CTRL, B, exec, ~/.config/waybar/scripts/launch_bluetooth.sh
bind = $mainMod CTRL, N, exec, ~/.config/waybar/scripts/swaync-client.sh

# --- Workspace Overview ---
bind = $mainMod CTRL, TAB, exec, ~/.config/hypr/scripts/workspace_overview.sh     # Super + Tab (Text)
bind = $mainMod, GRAVE, exec, ~/.config/hypr/scripts/workspace_overview.sh # Super + ` (Same as Super+Tab for now)
