general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 240
  on-timeout = notify-send "System Idle" "System idle for 4 minutes. Dimming screen in 1 minute" -i display-brightness-symbolic
}

listener {
  timeout = 300
  on-timeout = brightnessctl -s set 10         
  on-resume = brightnessctl -r                 
}

listener {
  timeout = 540
  on-timeout = notify-send "System Idle" "System idle for 9 minutes. Locking screen in 1 minute." -i system-lock-screen
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

listener {
  timeout = 1800
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

