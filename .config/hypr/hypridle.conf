general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 120
  on-timeout = notify-send "System Idle" "System idle for 2 minutes. Dimming screen in 30 seconds." -i display-brightness-symbolic
}

listener {
  timeout = 150
  on-timeout = brightnessctl -s set 10         
  on-resume = brightnessctl -r                 
}

listener {
  timeout = 210
  on-timeout = notify-send "System Idle" "System idle for 3.5 minutes. Locking screen in 30 seconds." -i system-lock-screen
}

listener {
  timeout = 240
  on-timeout = loginctl lock-session
}

listener {
  timeout = 1500
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

