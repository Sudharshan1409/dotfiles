# Description: Office setup - Laptop + 2 monitors
# --- Monitor Configuration ---
# See https://wiki.hyprland.org/Configuring/Monitors/
# Positions monitors left-to-right: Laptop -> Main -> Secondary
monitor = eDP-1, 1920x1080@120, 0x0, 1
monitor = DP-1, 2560x1440@60, 1920x0, 1
monitor = HDMI-A-1, 1920x1080@60, 4480x0, 1

# --- Assign Default Workspaces to Monitors ---
workspace=1,monitor:eDP-1
workspace=2,monitor:DP-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:eDP-1
workspace=5,monitor:DP-1
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:eDP-1
workspace=8,monitor:DP-1
workspace=9,monitor:HDMI-A-1


