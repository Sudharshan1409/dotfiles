# Description: Template for creating new monitor profiles
# Copy this file and customize for your setup
# Profile name should be descriptive (e.g., home-triple, office-desk, laptop-only)

# --- Monitor Configuration ---
# Format: monitor = PORT, RESOLUTION@REFRESH, POSITION, SCALE
# Position is calculated from the left edge of the leftmost monitor

# Example: Laptop + 2 external monitors
# monitor = eDP-1, 1920x1080@120, 0x0, 1
# monitor = HDMI-A-1, 2560x1440@165, 1920x0, 1
# monitor = DVI-I-1, 1920x1080@120, 4480x0, 1

# Example: Laptop only
# monitor = eDP-1, 1920x1080@120, 0x0, 1

# Example: Single external monitor
# monitor = HDMI-A-1, 3840x2160@60, 0x0, 1.5

# To disable a monitor:
# monitor = PORT, disable

# To use preferred resolution:
# monitor = PORT, preferred, auto, 1

# --- Workspace Assignments ---
# Assign workspaces to specific monitors
# Format: workspace=NUMBER,monitor:PORT

# Round-robin distribution example (workspaces 1,4,7 on first monitor):
# workspace=1,monitor:eDP-1
# workspace=2,monitor:HDMI-A-1
# workspace=3,monitor:DVI-I-1
# workspace=4,monitor:eDP-1
# workspace=5,monitor:HDMI-A-1
# workspace=6,monitor:DVI-I-1
# workspace=7,monitor:eDP-1
# workspace=8,monitor:HDMI-A-1
# workspace=9,monitor:DVI-I-1

# --- Additional Rules ---
# Add window rules specific to this setup
# Examples:
# windowrule = workspace 1, match:class ^(Spotify)$
# windowrule = monitor HDMI-A-1, match:class ^(firefox)$

# --- Tips ---
# 1. Use `hyprctl monitors` to see current monitor names and available modes
# 2. Use `hyprctl workspaces` to see current workspace assignments
# 3. Position coordinates start from 0x0 for the leftmost monitor
# 4. Make sure positions don't overlap for proper mouse movement between monitors
# 5. You can use 'auto' for position to let Hyprland place it automatically
