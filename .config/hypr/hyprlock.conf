# -----------------------------------------------------
# Source the color theme file
# -----------------------------------------------------
source = ~/.config/hypr/mocha.conf


# -----------------------------------------------------
# BACKGROUND
# -----------------------------------------------------
background {
    monitor =
    path = $HOME/.config/backgrounds/current.png # <-- THIS IS THE ONLY CHANGE
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}


# -----------------------------------------------------
# GENERAL
# -----------------------------------------------------
general {
    hide_cursor = false
}


# -----------------------------------------------------
# DATE
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $foreground
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}


# -----------------------------------------------------
# TIME
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $foreground
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}


# -----------------------------------------------------
# Profile Picture
# -----------------------------------------------------
image {
    monitor =
    path = ~/Pictures/Pics/dp_professional.png
    size = 150
    border_size = 4
    border_color = $mauve $blue 45deg
    position = 0, 30
    halign = center
    valign = center
    rounding = -1 # Makes the image a circle
}


# -----------------------------------------------------
# Welcome Message
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] sh -c 'fullname=$(getent passwd "$USER" | cut -d ":" -f 5 | cut -d "," -f 1); if [ -n "$fullname" ]; then echo "Welcome, $fullname"; else echo "Welcome, $USER"; fi'
    color = $foreground
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -100
    halign = center
    valign = center
}


# -----------------------------------------------------
# Greeting
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] sh -c 'hour=$(date +%H); if [ $hour -lt 12 ]; then echo "☀️ Good Morning"; elif [ $hour -lt 18 ]; then echo "🌤️ Good Afternoon"; else echo "🌙 Good Evening"; fi'
    color = $foreground
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}


# -----------------------------------------------------
# Lock Icon
# -----------------------------------------------------
label {
    monitor =
    text =  󰌾 
    color = $foreground
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}


# -----------------------------------------------------
# INPUT FIELD
# -----------------------------------------------------
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $mauve
    inner_color = rgba(30, 30, 46, 0.2)
    font_color = $foreground
    fade_on_empty = false
    rounding = 30
    check_color = $green
    fail_color = $red
    fail_text = <i>Incorrect Password</i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}


# -----------------------------------------------------
# OS Logo
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:3600000] /home/enigma/dotfiles/.config/hypr/scripts/get_lockscreen_info.sh os
    color = $foreground
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 440
    halign = center
    valign = center
}

# -----------------------------------------------------
# NOW PLAYING WIDGET
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] sh -c 'if playerctl status | grep -q "Playing"; then echo "󰎈 Now Playing: $(playerctl metadata artist) - $(playerctl metadata title)"; fi'
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -350
    halign = center
    valign = center
}


# -----------------------------------------------------
# SYSTEM INFORMATION
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] /home/enigma/dotfiles/.config/hypr/scripts/get_lockscreen_info.sh system
    color = $subtext1
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -420
    halign = center
    valign = center
}
