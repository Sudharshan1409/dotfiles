# A maximalist Starship configuration with many modules enabled.
# The hostname module has been removed.
# NOTE: You will need a Nerd Font installed and configured in your terminal
# to see all the symbols correctly.

# General Prompt Layout
format = """\
[╭─](bold blue)$username \
[in](bold green)$directory$vcsh\
$git_branch$git_state$git_status$git_metrics\
$hg_branch\
$aws$gcloud$azure$openstack$terraform$ansible\
$env_var\
$kubernetes$docker\
$java$kotlin$scala$golang$rust$python$nodejs$php$ruby$perl$elixir$haskell$nim$zig$lua$crystal$cmake$deno$swift$r\
$custom\
[─╮](bold blue)
[╰─](bold blue)$status$cmd_duration$battery$time\
$shell\
$line_break\
$character
"""

# Disable the blank line before the prompt
add_newline = true

# Modules are enabled by default if included in the `format` string,
# but we can configure their appearance or behavior.

# --- Global Style ---

[username]
format = "[$user]($style) "
style_user = "bold yellow"
show_always = true

[directory]
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false
style = "bold green"

[cmd_duration]
format = "[$duration]($style) "
style = "bold yellow"
min_time = 500                  # Only show if command took longer than 500ms

[status]
format = "[! $symbol]($style)"
symbol = "✗"
success_symbol = "[✔](bold green)"
not_found_symbol = "[?](bold red)"
sigint_symbol = "[^C](bold red)"
map_symbol = true
disabled = false

[time]
format = "[$time]($style) "
style = "bold white"
# FIXED: time_format for 12-hour clock without seconds (e.g., 04:44 PM)
time_format = "%I:%M %p"
disabled = false

[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
format = "[$symbol$percentage]($style) "

# This sets the rule to display the battery status at ANY charge level (up to 100%)
[[battery.display]]
threshold = 100
style = "bold white"

# --- Version Control Modules ---

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$stashed]($style)) "
stashed = " "
style = "red"
ahead = "${count}"
behind = "${count}"
diverged = "${ahead_count} ${behind_count}"
up_to_date = ""

[git_metrics]
format = "([+$added]($added_style) | [-$deleted]($deleted_style))"
added_style = "bold green"
deleted_style = "bold red"

[hg_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

# --- Cloud/Container Modules ---

[aws]
format = 'on [$symbol($profile) ($region) ]($style)'
symbol = ' '
style = "bold yellow"

[kubernetes]
format = 'on [$symbol$context\($namespace\) ]($style)'
symbol = '⎈ '
style = "bold cyan"
disabled = false

[docker_context]
symbol = " "
format = 'via [$symbol$context]($style) '
style = "bold blue"

# --- Language/Tool Modules (Only appear when active/detected) ---

[python]
symbol = "🐍 "
format = 'via [$symbol$version(\($virtualenv\)) ]($style)'
style = "bold green"

[nodejs]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold green"

[rust]
symbol = "🦀 "
format = "via [$symbol$version]($style) "
style = "bold red"

[golang]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold cyan"

[java]
symbol = "☕ "
format = "via [$symbol$version]($style) "
style = "bold red"

# Final Prompt Character

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
