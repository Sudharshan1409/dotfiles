# ~/.config/starship.toml
# Clean, natural-language Starship prompt

# ------------------------
# GENERAL LAYOUT
# ------------------------

format = """\
$username in $directory$git_branch$git_status$git_metrics\
$package\
$aws$gcloud$azure$openstack$terraform$ansible\
$kubernetes$docker_context\
$java$kotlin$scala$golang$rust$python$nodejs$php$ruby$perl$elixir$haskell$nim$zig$lua$crystal$cmake$deno$swift\
$direnv\
$cmd_duration$status$jobs\
$line_break\
$character
"""

right_format = """$time"""

add_newline = true

# ------------------------
# USER / DIRECTORY
# ------------------------

[username]
format = "[$user]($style)"
style_user = "bold yellow"
show_always = true

[directory]
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 🔒"
style = "bold green"

# ------------------------
# STATUS / TIME
# ------------------------

[cmd_duration]
format = " took [$duration]($style)"
style = "bold yellow"
min_time = 500

[status]
format = " exited [$status]($style)"
symbol = "✗"
success_symbol = ""
style = "bold red"
disabled = false

[jobs]
format = " with [$number job(s)]($style)"
style = "bold blue"
number_threshold = 1
symbol_threshold = 100
symbol = ""

[shell]
format = " in [$indicator]($style)"
zsh_indicator = "zsh"
bash_indicator = "bash"
fish_indicator = "fish"
powershell_indicator = "pwsh"
unknown_indicator = "shell"
style = "dimmed white"
disabled = true

[time]
format = " 🕒 [$time]($style)"
time_format = "%I:%M %p"
style = "bold white"
disabled = false

# ------------------------
# GIT
# ------------------------

[git_branch]
format = " on [$branch]($style)"
style = "bold purple"
truncation_length = 24
truncation_symbol = "…"

[git_status]
format = " ([$all_status$ahead_behind]($style))"
style = "bold red"
ahead = " ahead ${count}"
behind = " behind ${count}"
diverged = " diverged ${ahead_count}/${behind_count}"
conflicted = " ${count} conflict"
untracked = " ${count} new"
modified = " ${count} modified"
staged = " ${count} staged"
renamed = " ${count} renamed"
deleted = " ${count} deleted"
stashed = " with stash"

[git_metrics]
format = " (+$added | -$deleted)"
added_style = "bold green"
deleted_style = "bold red"

# ------------------------
# CLOUD / CONTAINERS
# ------------------------

[kubernetes]
format = " in k8s:[$context(\\($namespace\\))]($style)"
style = "bold cyan"

[docker_context]
format = " using docker:[$context]($style)"
style = "bold blue"

[aws]
format = " in aws:[$profile/$region]($style)"
style = "bold yellow"

# ------------------------
# LANGUAGES
# ------------------------

[python]
format = " via python [$version(\\($virtualenv\\))]($style)"
style = "bold green"

[nodejs]
format = " via node [$version]($style)"
style = "bold green"

[rust]
format = " via rust [$version]($style)"
style = "bold red"

[golang]
format = " via go [$version]($style)"
style = "bold cyan"

[java]
format = " via java [$version]($style)"
style = "bold red"

[package]
format = " is [v$version]($style)"
style = "bold 208"
disabled = false

[direnv]
format = " with [direnv $loaded/$allowed]($style)"
style = "bold yellow"
disabled = false
detect_files = [".envrc", ".env"]

# ------------------------
# FINAL PROMPT CHARACTER
# ------------------------

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
