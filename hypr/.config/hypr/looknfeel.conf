# --- General Layout Properties ---
# See https://wiki.hyprland.org/Configuring/Variables/#general

# Variables
$activeBorderColor = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorderColor = rgba(595959aa)

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 3
    # resize_on_border = false

    layout = dwindle
    allow_tearing = false
}

# --- Dwindle Layout Specifics ---
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true
    smart_split = false
    force_split = 2
    # smart_resizing = false
    # precise_mouse_move = true
}

# --- Decorations (Rounding, Blur, Shadow) ---
# See https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6

    blur {
        enabled = true
        size = 3
        passes = 3
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Disable blur for swaync notifications (MOVED OUT OF decoration block)
windowrule = no_blur on, match:class ^(swaync|swaync-client)$


# --- Group Configuration ---
group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    # col.border_locked_active = -1
    # col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# --- Animations ---
# See https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
}

#######################################################################################
# MISCELLANEOUS SETTINGS
#######################################################################################

xwayland {
    # force_zero_scaling = true
}

misc {
    # Disable the default anime wallpaper
    force_default_wallpaper = 0
    focus_on_activate = true

    # Window Swallowing
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty|com\.mitchellh\.ghostty)$
}

