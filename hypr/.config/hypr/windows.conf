#######################################################################################
# WINDOW RULES (UPDATED – NEW SYNTAX)
# https://wiki.hyprland.org/Configuring/Window-Rules/
#######################################################################################

#
# --- Global behavior ---
#

# Suppress maximize requests to keep windows tiled
windowrulev2 = suppressevent maximize, class:.*

# Default subtle opacity
windowrulev2 = opacity 0.97 0.9, class:.*

# Fix dragging / focus issues with XWayland ghost windows
windowrulev2 = nofocus, xwayland:1, floating:1, fullscreen:0, pinned:0, class:^$, title:^$

#
# --- Fix borders / shadows / blur on popups & dialogs ---
#

# XDG portal dialogs (Save As / Open File)
windowrulev2 = bordersize 0, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noblur, class:^(Xdg-desktop-portal-gtk)$

# Brave browser menus & popups (XWayland floating)
windowrulev2 = bordersize 0, class:^(Brave-browser)$, floating:1, xwayland:1
windowrulev2 = noshadow, class:^(Brave-browser)$, floating:1, xwayland:1
windowrulev2 = noblur, class:^(Brave-browser)$, floating:1, xwayland:1

#
# --- Floating windows ---
#

windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(blueberry.py)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(com.cisco.secureclient.gui)$
windowrulev2 = float, class:^(hyprland-share-picker)$

# Terminal htop popup
windowrulev2 = float, class:^($TERMINAL)$, title:^(htop)$

#
# --- Size & centering for floating windows ---
#

windowrulev2 = size 60% 60%, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

windowrulev2 = size 60% 60%, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# Terminal htop sizing
windowrulev2 = size 1500 1000, class:^($TERMINAL)$, title:^(htop)$
windowrulev2 = center, class:^($TERMINAL)$, title:^(htop)$

#
# --- Animations ---
#

# Rofi dropdown animation
windowrulev2 = animation slide-down, class:^Rofi$

#
# --- Catch invalid empty-class windows ---
#

windowrulev2 = noblur, class:^$, title:^$


#
# --- App-specific rules ---
#

source = ~/.config/hypr/apps.conf
