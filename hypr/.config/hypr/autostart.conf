# --- Programs and Services to Execute at Launch ---
# critical for dbus/notifications
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DBUS_SESSION_BUS_ADDRESS
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DBUS_SESSION_BUS_ADDRESS

exec-once = waybar & swaync & hypridle & (which swww-daemon >/dev/null 2>&1 && swww-daemon || hyprpaper)
exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 24
exec-once = sh -c "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1"
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator


exec-once = ~/.config/hypr/scripts/set_wallpaper.sh --init

# Start monitor event listener for automatic profile switching
exec-once = ~/.config/hypr/scripts/launch_monitor_listener.sh

# Start battery monitor (low-charge alerts + auto power-profile switching)
exec-once = ~/.config/hypr/scripts/launch_battery_monitor.sh

