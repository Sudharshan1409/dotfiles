# Description: Template for creating new monitor profiles
# Copy this file and customize for your setup, or run the interactive wizard:
#   `~/.config/hypr/scripts/monitor_wizard.sh` (or Ctrl+Super+D -> 🪄 Setup Wizard)
# Profile name should be descriptive (e.g., home-triple, office-desk, laptop-only)

# ==============================================================================
# 🎯 Anti-Blur & Crisp Fractional Scaling Strategy
# ==============================================================================
# 1. ALWAYS send the monitor's native panel resolution (e.g. 3840x2160 for 4K).
#    Do NOT lower the resolution to 2560x1440 in Hyprland! That forces the monitor
#    hardware to interpolate pixels, producing blurry text and fuzzy UI elements.
# 2. Use Hyprland's fractional scaling (`scale = 1.50` or `1.25`) to get the
#    ideal UI size while keeping text and graphics rendered with 4K native crispness.
# 3. For XWayland compatibility, `xwayland { force_zero_scaling = true }` is enabled
#    in looknfeel.conf to prevent legacy X11 apps from becoming blurry.

# ==============================================================================
# 📐 Logical Coordinate Math Formula
# ==============================================================================
# Hyprland positions monitors in LOGICAL coordinates:
#   Logical Width = Physical Width / Scale
#
# Position formula for horizontal layout (top-aligned Y=0):
#   Monitor 1 (Leftmost): 0x0
#   Monitor 2 (Right):    (Logical Width 1)x0
#   Monitor 3:            (Logical Width 1 + Logical Width 2)x0
#
# Examples:
# - 4K display at 1.50 scale: 3840 / 1.50 = 2560 logical width
# - 4K display at 1.25 scale: 3840 / 1.25 = 3072 logical width
# - 1080p display at 1.00 scale: 1920 / 1.00 = 1920 logical width
# - 1440p display at 1.00 scale: 2560 / 1.00 = 2560 logical width

# --- Monitor Configuration Examples ---
# Format: monitor = PORT, RESOLUTION@REFRESH, POSITION, SCALE

# Example 1: 4K External Monitor on Left (1.5x scale) + 1080p Laptop on Right (1.0x scale)
# monitor = HDMI-A-1, 3840x2160@60, 0x0, 1.50
# monitor = eDP-1, 1920x1080@60, 2560x0, 1.00

# Example 2: 1080p Laptop on Left (1.0x scale) + 4K External on Right (1.5x scale)
# monitor = eDP-1, 1920x1080@60, 0x0, 1.00
# monitor = HDMI-A-1, 3840x2160@60, 1920x0, 1.50

# Example 3: Laptop only
# monitor = eDP-1, 1920x1080@120, 0x0, 1.00

# Example 4: To disable a monitor port:
# monitor = PORT, disable

# --- Workspace Assignments ---
# Assign workspaces to specific monitors (workspaces 1-9 round-robin):
# Format: workspace=NUMBER,monitor:PORT
# workspace=1,monitor:eDP-1
# workspace=2,monitor:HDMI-A-1
# workspace=3,monitor:eDP-1
# workspace=4,monitor:HDMI-A-1
# workspace=5,monitor:eDP-1
# workspace=6,monitor:HDMI-A-1
# workspace=7,monitor:eDP-1
# workspace=8,monitor:HDMI-A-1
# workspace=9,monitor:eDP-1

# --- Additional Rules ---
# Add window rules specific to this setup:
# windowrule = workspace 1, match:class ^(Spotify)$
# windowrule = monitor HDMI-A-1, match:class ^(firefox)$
