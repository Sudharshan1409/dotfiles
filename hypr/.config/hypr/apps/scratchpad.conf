# -----------------------------------------------------------------------------
# Scratchpad terminal (Super + S)
# -----------------------------------------------------------------------------
# Toggleable floating Ghostty on a dedicated special workspace.
# Spawn / toggle logic lives in scripts/scratchpad_terminal.sh.

windowrule = workspace special:scratch, match:class ^(scratchpad-terminal)$
windowrule = float on, match:class ^(scratchpad-terminal)$
windowrule = size 100% 100%, match:class ^(scratchpad-terminal)$
windowrule = center on, match:class ^(scratchpad-terminal)$
windowrule = opacity 0.95 0.9, match:class ^(scratchpad-terminal)$
