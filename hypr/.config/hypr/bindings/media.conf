# --- Hardware Keys & System Utilities ---
# Volume & Mute Keys (bindel for repeat+locked, bindl for locked toggle)
bindel = , XF86AudioRaiseVolume, exec, ~/.config/waybar/scripts/volume-control.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/waybar/scripts/volume-control.sh down
bindl  = , XF86AudioMute, exec, ~/.config/waybar/scripts/volume-control.sh mute
bindl  = , XF86AudioMicMute, exec, ~/.config/waybar/scripts/mic-control.sh mute

# Media Playback Controls (bindl for locked toggle/navigation)
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

# Display Brightness Keys (bindel for repeat+locked)
bindel = , XF86MonBrightnessUp, exec, ~/.config/waybar/scripts/brightness-control.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/waybar/scripts/brightness-control.sh down

bind = , Print, exec, ~/.config/hypr/scripts/screenshot_screen_edit.sh
bind = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot_window_edit.sh
bind = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot_edit.sh
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot_edit.sh
